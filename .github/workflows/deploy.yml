name: Deploy to hosting via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CONTACT_FORM_SERVICE_ID: ${{ secrets.VITE_CONTACT_FORM_SERVICE_ID }}
          VITE_CONTACT_FORM_TEMPLATE_ID: ${{ secrets.VITE_CONTACT_FORM_TEMPLATE_ID }}
          VITE_CONTACT_FORM_PUBLIC_KEY: ${{ secrets.VITE_CONTACT_FORM_PUBLIC_KEY }}
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /autogas-varna.com/public_html/
